<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Penny Bin Protocol™ (DPB Ver6)</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --border: #e2e8f0;
            --success: #10b981;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            max-width: 900px;
            margin: 30px auto;
            padding: 20px;
            line-height: 1.5;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }
        h1 { margin: 0; font-size: 24px; color: var(--text-primary); }
        .badge {
            background: #eff6ff;
            color: var(--accent);
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 13px;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }
        .card {
            background: var(--card-bg);
            padding: 24px;
            border-radius: 10px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            border: 1px solid var(--border);
        }
        h2 { font-size: 18px; margin-top: 0; margin-bottom: 16px; color: var(--text-primary); }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-secondary);
        }
        input, select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 15px;
            box-sizing: border-box;
            background: #fff;
        }
        input:focus, select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }
        button:hover { background: var(--accent-hover); }
        pre {
            background: #0f172a;
            color: #38bdf8;
            padding: 16px;
            border-radius: 6px;
            font-size: 13px;
            overflow-x: auto;
            margin: 0;
            min-height: 180px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Digital Penny Bin Protocol™</h1>
        <div class="badge">DPB Ver6 Simulator</div>
    </div>

    <div class="grid">
        <div class="card">
            <h2>Transaction Simulator</h2>
            <div class="form-group">
                <label for="rawAmount">Raw Amount ($)</label>
                <input type="number" id="rawAmount" step="0.01" value="12.34">
            </div>
            <div class="form-group">
                <label for="tier">Rounding Tier</label>
                <select id="tier">
                    <option value="nickel">Nickel (5¢)</option>
                    <option value="dime">Dime (10¢)</option>
                    <option value="quarter">Quarter (25¢)</option>
                    <option value="dollar">Dollar ($1.00)</option>
                </select>
            </div>
            <div class="form-group">
                <label for="currentBinRemainder">Current Bin Remainder ($)</label>
                <input type="number" id="currentBinRemainder" step="0.01" value="0.00">
            </div>
            <div class="form-group">
                <label for="currentCommunityVault">Community Vault ($)</label>
                <input type="number" id="currentCommunityVault" step="0.01" value="100.00">
            </div>
            <button onclick="runSimulation()">Process Rounding Engine</button>
        </div>

        <div class="card">
            <h2>Engine Output State</h2>
            <pre id="output">Click "Process Rounding Engine" to test transaction flow...</pre>
        </div>
    </div>

    <script>
        async function runSimulation() {
            const payload = {
                rawAmount: parseFloat(document.getElementById('rawAmount').value),
                tier: document.getElementById('tier').value,
                currentBinRemainder: parseFloat(document.getElementById('currentBinRemainder').value),
                currentCommunityVault: parseFloat(document.getElementById('currentCommunityVault').value)
            };

            try {
                const response = await fetch('/api/rounding', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await response.json();
                document.getElementById('output').textContent = JSON.stringify(data, null, 2);
            } catch (err) {
                document.getElementById('output').textContent = 'Error connecting to DPB server: ' + err.message;
            }
        }
    </script>
</body>
</html>
